<div id="lightbox" class="lightbox fixed inset-0 z-[70] flex items-center justify-center bg-black/90 p-4" aria-hidden="true" role="dialog" aria-label="Galeri görseli">
  <button id="lightbox-close" class="absolute right-5 top-5 grid h-11 w-11 place-items-center rounded-full border border-white/20 text-white" type="button" aria-label="Kapat">✕</button>
  <button id="lightbox-prev" class="absolute left-4 grid h-11 w-11 place-items-center rounded-full border border-white/20 text-white md:left-8" type="button" aria-label="Önceki">‹</button>
  <figure class="max-h-[82vh] max-w-5xl">
    <img id="lightbox-image" alt="" class="max-h-[74vh] w-full rounded-2xl object-contain" />
    <figcaption id="lightbox-caption" class="mt-3 text-center text-sm uppercase tracking-[0.18em] text-white/70"></figcaption>
  </figure>
  <button id="lightbox-next" class="absolute right-4 grid h-11 w-11 place-items-center rounded-full border border-white/20 text-white md:right-8" type="button" aria-label="Sonraki">›</button>
</div>
